services:
  workbench:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
