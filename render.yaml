# Creates a PAID web service when applied in Render. Review the quoted price first.
# One instance and one Python worker are required by in-memory sessions.
services:
  - type: web
    name: econ-workbench
    runtime: docker
    plan: 1c-2g
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "8000"
      - key: ECON_DEPLOYMENT_MODE
        value: cloud
      - key: ECON_MAX_SESSIONS
        value: "6"
      - key: ECON_MAX_CONCURRENT_JOBS
        value: "1"
      - key: ECON_SESSION_DATA_MB
        value: "64"
      - key: ECON_TOTAL_DATA_MB
        value: "256"
